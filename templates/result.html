<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results - AI Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .results-container { max-width: 1200px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <header class="results-header">
            <div>
                <h1>Analysis Results</h1>
            </div>
            <div class="results-toolbar">
                <button type="button" class="btn-secondary" id="exportJsonBtn">Export JSON</button>
                <a href="/" class="btn-back">New analysis</a>
            </div>
        </header>
        
        <main class="results-container" id="resultsContainer">
            <div class="loading"><p>Loading results...</p></div>
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='js/results.js') }}"></script>
</body>
</html>
