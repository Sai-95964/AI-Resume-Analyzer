<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results - AI Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .results-container { max-width: 1200px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <header class="results-header">
            <div>
                <h1>Analysis Results</h1>
            </div>
            <div class="results-toolbar">
                <button type="button" class="btn-secondary" id="exportJsonBtn">Export JSON</button>
                <a href="/" class="btn-back">New analysis</a>
            </div>
        </header>
        
        <main class="results-container" id="resultsContainer">
            <div class="loading"><p>Loading results...</p></div>
        </main>
        <div class="results-actions" style="padding:20px; text-align:right;">
            <button id="downloadReportBtn" class="btn-analyze">Download Analysis Report</button>
        </div>
        <div class="dashboard" style="padding:20px;">
            <h3>ATS Breakdown</h3>
            <canvas id="atsChart" width="400" height="200"></canvas>
            <h3>Skill Distribution</h3>
            <canvas id="skillsChart" width="400" height="200"></canvas>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/results.js') }}"></script>
</body>
</html>
